plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// vlcj (video playback) and JNA are published on Maven Central.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pixelreel" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// vlcj drives video/audio decoding through the locally installed VLC (libVLC).
	// The jars are bundled inside the mod jar so players only need VLC itself.
	implementation "uk.co.caprica:vlcj:${project.vlcj_version}"
	include "uk.co.caprica:vlcj:${project.vlcj_version}"
	include "uk.co.caprica:vlcj-natives:${project.vlcj_natives_version}"
	include "net.java.dev.jna:jna:${project.jna_version}"
	include "net.java.dev.jna:jna-platform:${project.jna_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register("securityAudit") {
	group = "verification"
	description = "Checks for known credential leak regressions in packets and world-save serialization."

	doLast {
		def root = project.layout.projectDirectory
		def failures = []

		def displayEntity = root.file("src/main/java/com/pixelreel/blockentities/DisplayBlockEntity.java").asFile.text
		[
			"output.putString(KEY_STREAM_URL, this.streamUrl)",
			"output.putString(KEY_MEDIA_IMAGE, this.mediaImageUrl)",
			"output.putString(KEY_SUB_URL, this.subtitleFetchUrl)",
			"output.putString(KEY_PLEX_PART_KEY, this.plexPartKey)"
		].each { needle ->
			if (displayEntity.contains(needle)) {
				failures << "DisplayBlockEntity persists a secret-bearing field: ${needle}"
			}
		}

		def serverNetworking = root.file("src/main/java/com/pixelreel/networking/ServerNetworking.java").asFile.text
		if (!serverNetworking.contains("ChannelService.INSTANCE.entries().stream().map(ChannelEntry::withoutClientSecrets).toList()")) {
			failures << "Channel list packets must redact stream/artwork URLs with ChannelEntry::withoutClientSecrets."
		}
		if (!serverNetworking.contains("items.stream().map(JellyfinItemSummary::forClientPacket).toList()")) {
			failures << "Media children/detail packets must redact provider poster URLs with JellyfinItemSummary::forClientPacket."
		}
		if (!serverNetworking.contains("canReceivePlaybackUrl(player, display)")) {
			failures << "Playback URL delivery must check the player's media permissions."
		}

		def itemSummary = root.file("src/main/java/com/pixelreel/jellyfin/JellyfinItemSummary.java").asFile.text
		if (!itemSummary.contains("this.forClientPacket(false)") || !itemSummary.contains('""')) {
			failures << "JellyfinItemSummary client packet helpers must redact imageUrl."
		}

		if (!failures.isEmpty()) {
			throw new GradleException("Security audit failed:\n - " + failures.join("\n - "))
		}
	}
}

tasks.named("check") {
	dependsOn(tasks.named("securityAudit"))
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
